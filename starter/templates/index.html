<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sudoku Game</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <main class="game">
    <header class="page-header">
      <h1>Sudoku Game</h1>
      <button id="theme-toggle" type="button" aria-label="Toggle dark mode" aria-pressed="false">Dark mode</button>
    </header>
    <div id="sudoku-board" aria-label="Sudoku puzzle"></div>
    <form id="score-form" class="score-entry" aria-labelledby="score-entry-title" hidden>
      <h2 id="score-entry-title">Save your time</h2>
      <label for="player-name">Name</label>
      <div class="score-entry-controls">
        <input id="player-name" name="playerName" type="text" maxlength="40" autocomplete="name" required>
        <button type="submit">Save</button>
      </div>
    </form>
    <div class="controls">
      <label for="difficulty">Difficulty</label>
      <select id="difficulty" name="difficulty">
        <option value="easy">Easy</option>
        <option value="medium" selected>Medium</option>
        <option value="hard">Hard</option>
      </select>
      <button id="new-game" type="button">New Game</button>
      <button id="check-solution" type="button">Check</button>
      <button id="get-hint" type="button">Hint</button>
    </div>
    <div class="game-stats" aria-label="Game statistics">
      <p>Time: <span id="timer" aria-live="off">00:00</span></p>
      <p>Hints used: <span id="hints-used">0</span></p>
    </div>
    <p id="message" role="status" aria-live="polite"></p>
    <section class="leaderboard" aria-labelledby="leaderboard-title">
      <h2 id="leaderboard-title">Top 10 fastest times</h2>
      <div class="table-container">
        <table>
          <thead>
            <tr>
              <th scope="col">Rank</th>
              <th scope="col">Player</th>
              <th scope="col">Time</th>
              <th scope="col">Difficulty</th>
              <th scope="col">Hints</th>
            </tr>
          </thead>
          <tbody id="leaderboard-body"></tbody>
        </table>
      </div>
    </section>
  </main>
  <script src="/static/main.js"></script>
</body>
</html>
