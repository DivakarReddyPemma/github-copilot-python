<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sudoku Game</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <main class="game">
    <h1>Sudoku Game</h1>
    <div id="sudoku-board" aria-label="Sudoku puzzle"></div>
    <div class="controls">
      <label for="difficulty">Difficulty</label>
      <select id="difficulty" name="difficulty">
        <option value="easy">Easy</option>
        <option value="medium" selected>Medium</option>
        <option value="hard">Hard</option>
      </select>
      <button id="new-game" type="button">New Game</button>
      <button id="check-solution" type="button">Check</button>
      <button id="get-hint" type="button">Hint</button>
    </div>
    <div class="game-stats" aria-label="Game statistics">
      <p>Time: <span id="timer" aria-live="off">00:00</span></p>
      <p>Hints used: <span id="hints-used">0</span></p>
    </div>
    <p id="message" role="status" aria-live="polite"></p>
  </main>
  <script src="/static/main.js"></script>
</body>
</html>
